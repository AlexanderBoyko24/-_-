<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задание: Фазы митоза</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,700;1,7..72,500&display=swap" rel="stylesheet">
<style>
:root{--w:960px;
  --bg:#080c1c;
  --text:#eef1ff;
  --muted:#98a2c8;
  --line:rgba(160,176,255,.16);
  --A:#3ddc97;
  --T:#ff5d73;
  --G:#ffc53d;
  --C:#4aa8ff;
  --cyan:#4aa8ff;--mint:#3ddc97;--pink:#e48bff;--violet:#a58bff;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --sans:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;padding:40px 18px 34px;color:var(--text);
  font-family:var(--sans);overflow-x:hidden;position:relative;
  background:
    radial-gradient(900px 520px at 12% -8%,rgba(74,168,255,.13),transparent 60%),
    radial-gradient(800px 520px at 100% 105%,rgba(255,93,115,.10),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}

.helix-bg{position:fixed;top:0;bottom:0;width:150px;z-index:0;pointer-events:none;opacity:.55}
.helix-bg svg{width:100%;height:100%;display:block}
.helix-left{left:-34px}
.helix-right{right:-34px;transform:scaleX(-1)}

.page{width:min(100%,var(--w,960px));margin:auto;position:relative;z-index:2}

.head{text-align:center;margin-bottom:26px}
.kicker{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:14px}
.kicker .bases{display:inline-flex;gap:3px}
.kicker .bases i{width:7px;height:14px;border-radius:2px;display:block}
.kicker .bases i:nth-child(1){background:var(--A)}
.kicker .bases i:nth-child(2){background:var(--T)}
.kicker .bases i:nth-child(3){background:var(--G)}
.kicker .bases i:nth-child(4){background:var(--C)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,5.4vw,50px);line-height:1.1;letter-spacing:-.02em;margin:0}
.subtitle{max-width:640px;margin:16px auto 20px;color:var(--muted);font-size:15px;line-height:1.7}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border:1px solid var(--line);border-radius:8px;background:rgba(16,23,52,.7);font-size:12.5px;color:#c9d1f3}
.chip:before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--A))}
.chip:nth-child(1){--c:var(--A)}.chip:nth-child(2){--c:var(--T)}.chip:nth-child(3){--c:var(--C)}

/* карточка задания */
.task-card{position:relative;overflow:hidden;width:100%;padding:34px 30px 30px;margin-bottom:22px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,rgba(21,30,66,.92),rgba(11,17,40,.92));box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.04)}
.task-card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--A) 0 25%,var(--T) 25% 50%,var(--G) 50% 75%,var(--C) 75%)}


/* общие элементы */
.plate{display:block;max-width:100%;height:auto;margin:0 auto;padding:12px;border-radius:14px;background:#fff;border:1px solid rgba(255,255,255,.25);box-shadow:0 0 0 6px rgba(160,176,255,.08),0 16px 36px rgba(0,0,0,.45)}
.task-title{display:flex;align-items:center;gap:12px;margin:0 0 20px;font-family:var(--serif);font-size:22px;font-weight:700}
.task-title:before{content:"";width:6px;height:26px;border-radius:3px;background:var(--tc,var(--C))}
.rule-box{margin-bottom:22px;padding:16px 18px;border-radius:12px;border:1px solid rgba(74,168,255,.3);background:rgba(74,168,255,.07);color:#d5dcff;font-size:14px;line-height:1.8}
.rule-box b{font-family:var(--serif);font-size:15px}
.rule-box small{font-size:12.5px}
.dna-label{display:flex;align-items:center;gap:9px;margin-bottom:10px;color:var(--muted);font:600 14px var(--sans)}
.dna-label i{color:var(--C)}
.dna-seq{margin-bottom:18px;padding:16px 18px;border-radius:12px;border:1px solid var(--line);background:rgba(5,9,26,.55);font:600 18px/1.8 var(--sans);letter-spacing:.06em;word-break:break-all;color:#dfe5ff}
.dna-seq .nt{display:inline-block;min-width:1ch;text-align:center}
.nt-A{color:var(--A)}.nt-T{color:var(--T)}.nt-G{color:var(--G)}.nt-C{color:var(--C)}.nt-sep{color:#4c577f}
.input-group,.rna-input-wrapper{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.input-group label,.rna-input-wrapper label{color:#c9d1f3;font:600 14px var(--sans)}
input[type="text"]{width:100%;padding:13px 16px;border:1px solid rgba(160,176,255,.28);border-radius:10px;background:rgba(8,12,34,.8);color:var(--text);font:500 15px var(--sans);outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
input[type="text"]::placeholder{color:#6f7aa6}
input[type="text"]:focus{border-color:var(--C);box-shadow:0 0 0 3px rgba(74,168,255,.18)}
input[type="text"].correct{border-color:var(--A);background:rgba(61,220,151,.10);color:#d6ffee}
input[type="text"].wrong{border-color:var(--T);background:rgba(255,93,115,.10);color:#ffd9de}

.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}
button{font-family:var(--sans);font-weight:700;font-size:14px;padding:13px 26px;border-radius:11px;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s;border:none}
button:focus-visible,.next-page-btn:focus-visible,input:focus-visible,.item-card:focus-visible{outline:2px solid #fff;outline-offset:3px}
#check{background:linear-gradient(100deg,var(--A),var(--C));color:#080c1c;box-shadow:0 10px 28px rgba(74,168,255,.2)}
#check:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(74,168,255,.32)}
#showAnswer{background:transparent;border:1px solid rgba(74,168,255,.6);color:#9cc9ff}
#showAnswer:hover{background:rgba(74,168,255,.12);transform:translateY(-2px)}
#reset{background:rgba(160,176,255,.07);border:1px solid rgba(160,176,255,.3);color:#d5dbff}
#reset:hover{background:rgba(160,176,255,.16);transform:translateY(-2px)}
#result{text-align:center;margin-top:22px;font:700 16px/1.4 var(--serif);min-height:24px;color:var(--A);transition:color .3s}
.next-page-btn{display:flex;width:fit-content;max-width:100%;align-items:center;justify-content:center;gap:12px;margin:28px auto 0;padding:15px 26px;border-radius:12px;text-decoration:none;color:#080c1c;background:linear-gradient(100deg,var(--A),var(--C));font-size:14px;font-weight:700;box-shadow:0 10px 30px rgba(74,168,255,.2);transition:transform .2s,box-shadow .2s}
.next-page-btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(74,168,255,.32)}

/* банк карточек и зоны (8, 9) */
.pool-title{display:flex;align-items:center;gap:9px;margin-bottom:12px;font:700 17px var(--serif)}
.pool-title i{color:var(--C)}
.items-pool{display:flex;flex-wrap:wrap;gap:10px;min-height:100px;margin-bottom:28px;padding:18px;border-radius:14px;border:1px dashed rgba(160,176,255,.3);background:rgba(5,9,26,.45)}
.item-card{max-width:100%;padding:12px 16px;border:1px solid rgba(160,176,255,.28);border-left:4px solid var(--c,var(--C));border-radius:8px;background:rgba(160,176,255,.07);color:#dfe5ff;font:500 14px/1.5 var(--sans);cursor:grab;user-select:none;transition:background .2s,transform .2s,box-shadow .2s,border-color .2s}
.item-card:hover{background:rgba(160,176,255,.16);transform:translateY(-2px)}
.item-card.selected{background:rgba(255,197,61,.16);border-color:var(--G);box-shadow:0 0 18px rgba(255,197,61,.28);color:#fff}
.zones-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.drop-zone{position:relative;display:flex;flex-direction:column;gap:10px;min-height:200px;padding:20px 18px 18px;border:2px dashed rgba(160,176,255,.3);border-radius:14px;background:rgba(5,9,26,.5);transition:border-color .2s,background .2s,box-shadow .2s}
.drop-zone.over{border-color:var(--G);background:rgba(255,197,61,.07);box-shadow:inset 0 0 24px rgba(255,197,61,.12)}
.drop-zone.correct{border-color:var(--A);border-style:solid;background:rgba(61,220,151,.07)}
.drop-zone.wrong{border-color:var(--T);border-style:solid;background:rgba(255,93,115,.07)}
.zone-title{margin-bottom:6px;text-align:center;font:700 18px var(--serif);pointer-events:none}
.zone-image{display:block;width:100%;max-height:170px;object-fit:contain;margin:0 auto 4px;padding:8px;border-radius:12px;background:#fff;pointer-events:none}
.match-layout{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.images-col,.zones-col{flex:1;min-width:280px;max-width:420px;display:flex;flex-direction:column;gap:14px}
.images-col{padding:20px;border-radius:14px;border:1px solid var(--line);background:rgba(5,9,26,.45)}
.col-title{margin-bottom:4px;text-align:center;font:700 18px var(--serif)}
.image-card{position:relative;display:flex;justify-content:center;align-items:center;padding:10px;border:2px solid transparent;border-radius:12px;background:#fff;cursor:grab;transition:border-color .2s,box-shadow .2s,transform .2s}
.image-card:hover{border-color:var(--C);box-shadow:0 0 18px rgba(74,168,255,.4);transform:translateY(-2px)}
.image-card.selected{border-color:var(--G);box-shadow:0 0 22px rgba(255,197,61,.55);transform:scale(1.02)}
.image-card.placed{opacity:.25;pointer-events:none;transform:none;box-shadow:none}
.image-card img{max-width:100%;height:100px;object-fit:contain;pointer-events:none}
.drop-zone{min-height:130px;align-items:center;justify-content:center;padding:15px}
.zone-label{margin-bottom:8px;font:700 18px var(--serif);color:var(--text);pointer-events:none}
.placed-img{max-height:80px;max-width:100%;object-fit:contain;padding:5px;border-radius:6px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.5)}
@media(max-width:768px){.match-layout{flex-direction:column;align-items:center}.images-col,.zones-col{width:100%;max-width:100%}.image-card img{height:80px}.drop-zone{min-height:110px}}

@media(max-width:820px){.helix-bg{opacity:.3;width:110px}}
@media(max-width:600px){
  body{padding:28px 12px}
  .task-card{padding:22px 12px 20px}
  .subtitle{font-size:14px}
  .task-title{font-size:20px}
  .dna-seq{font-size:15px;padding:12px}
  .controls button{flex:1 1 100%}
  .next-page-btn{width:100%;text-align:center}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="helix-bg helix-left" id="helixL" aria-hidden="true"></div>
<div class="helix-bg helix-right" id="helixR" aria-hidden="true"></div>

<main class="page">
    <header class="head">
        <div class="kicker"><span class="bases" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Интерактивная биология</div>
        <h1>Фазы митоза</h1>
        <p class="subtitle">Перетащите картинки с фазами митоза в соответствующие ячейки с их названиями. (Или нажмите на картинку, а затем на нужное название).</p>
        <div class="chips"><span class="chip">4 фазы</span><span class="chip">Перетаскивание или клик</span></div>
    </header>

    <div class="task-card">
        <div class="match-layout">
            
            <!-- Левая колонка: Картинки -->
            <div class="images-col" id="imagesCol">
                <div class="col-title">Картинки</div>
                
                <!-- Картинка 1: Профаза -->
                <div class="image-card" draggable="true" data-phase="prophase" id="img-prophase">
                    <img src="images/профаза.png" alt="Профаза" onerror="this.onerror=null;this.src='https://placehold.co/200x120/111827/55e6f2?text=Профаза'">
                </div>
                
                <!-- Картинка 2: Метафаза -->
                <div class="image-card" draggable="true" data-phase="metaphase" id="img-metaphase">
                    <img src="images/метафаза.png" alt="Метафаза" onerror="this.onerror=null;this.src='https://placehold.co/200x120/111827/55e6f2?text=Метафаза'">
                </div>
                
                <!-- Картинка 3: Анафаза -->
                <div class="image-card" draggable="true" data-phase="anaphase" id="img-anaphase">
                    <img src="images/анафаза.png" alt="Анафаза" onerror="this.onerror=null;this.src='https://placehold.co/200x120/111827/55e6f2?text=Анафаза'">
                </div>
                
                <!-- Картинка 4: Телофаза -->
                <div class="image-card" draggable="true" data-phase="telophase" id="img-telophase">
                    <img src="images/телофаза.png" alt="Телофаза" onerror="this.onerror=null;this.src='https://placehold.co/200x120/111827/55e6f2?text=Телофаза'">
                </div>
            </div>

            <!-- Правая колонка: Зоны с названиями -->
            <div class="zones-col">
                <div class="col-title">Названия фаз</div>
                
                <div class="drop-zone" data-answer="prophase">
                    <div class="zone-label">Профаза</div>
                </div>
                
                <div class="drop-zone" data-answer="metaphase">
                    <div class="zone-label">Метафаза</div>
                </div>
                
                <div class="drop-zone" data-answer="anaphase">
                    <div class="zone-label">Анафаза</div>
                </div>
                
                <div class="drop-zone" data-answer="telophase">
                    <div class="zone-label">Телофаза</div>
                </div>
            </div>

        </div>

        <div class="controls">
            <button id="check">✓ Проверить</button>
            <button id="showAnswer">👁 Показать ответ</button>
            <button id="reset">↺ Сбросить</button>
        </div>

        <div id="result" aria-live="polite"></div>
    </div>

    <a href="8.html" class="next-page-btn">Перейти к следующему заданию <i class="fas fa-arrow-right"></i></a>
</main>

<script>
    const imageCards = document.querySelectorAll('.image-card');
    const dropZones = document.querySelectorAll('.drop-zone');
    const imagesCol = document.getElementById('imagesCol');
    const resultDiv = document.getElementById('result');
    let selectedCard = null;

    // --- ЛОГИКА DRAG & DROP ---
    imageCards.forEach(card => {
        card.addEventListener('dragstart', (e) => {
            if (card.classList.contains('placed')) {
                e.preventDefault();
                return;
            }
            e.dataTransfer.setData('text/plain', card.id);
            setTimeout(() => card.style.opacity = '0.4', 0);
        });

        card.addEventListener('dragend', () => {
            card.style.opacity = '1';
        });

        // Клик для мобильных устройств (выбор карточки)
        card.addEventListener('click', () => {
            if (card.classList.contains('placed')) return;
            
            if (selectedCard) selectedCard.classList.remove('selected');
            selectedCard = card;
            selectedCard.classList.add('selected');
        });
    });

    dropZones.forEach(zone => {
        zone.addEventListener('dragover', (e) => {
            e.preventDefault();
            zone.classList.add('over');
        });

        zone.addEventListener('dragleave', () => {
            zone.classList.remove('over');
        });

        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            zone.classList.remove('over');
            
            const cardId = e.dataTransfer.getData('text/plain');
            const card = document.getElementById(cardId);
            
            if (card) placeImageInZone(card, zone);
        });

        // Клик для мобильных устройств (вставка в зону)
        zone.addEventListener('click', () => {
            if (selectedCard) {
                placeImageInZone(selectedCard, zone);
                selectedCard.classList.remove('selected');
                selectedCard = null;
            }
        });
    });

    // Функция помещения картинки в зону
    function placeImageInZone(card, zone) {
        // Если в зоне уже есть картинка, возвращаем её обратно в левую колонку
        const existingImg = zone.querySelector('.placed-img');
        if (existingImg) {
            const oldCardId = existingImg.dataset.originId;
            const oldCard = document.getElementById(oldCardId);
            if (oldCard) {
                oldCard.classList.remove('placed');
                imagesCol.appendChild(oldCard);
            }
            existingImg.remove();
        }

        // Создаем копию картинки для зоны (чтобы оригинал можно было вернуть)
        const imgSrc = card.querySelector('img').src;
        const placedImg = document.createElement('img');
        placedImg.src = imgSrc;
        placedImg.className = 'placed-img';
        placedImg.dataset.originId = card.id;
        
        zone.appendChild(placedImg);
        
        // Прячем оригинальную карточку в левой колонке
        card.classList.add('placed');
        card.classList.remove('selected');
        zone.classList.remove('correct', 'wrong');
        resultDiv.textContent = '';
    }

    // --- ПРОВЕРКА ---
    document.getElementById('check').addEventListener('click', () => {
        let correctCount = 0;
        let filledCount = 0;

        dropZones.forEach(zone => {
            zone.classList.remove('correct', 'wrong');
            const placedImg = zone.querySelector('.placed-img');
            
            if (placedImg) {
                filledCount++;
                const imgPhase = placedImg.dataset.originId.replace('img-', '');
                const correctAnswer = zone.dataset.answer;

                if (imgPhase === correctAnswer) {
                    zone.classList.add('correct');
                    correctCount++;
                } else {
                    zone.classList.add('wrong');
                }
            }
        });

        if (correctCount === 4) {
            resultDiv.textContent = '🎉 Отлично! Все фазы митоза определены верно!';
            resultDiv.style.color = 'var(--A)';
        } else {
            resultDiv.textContent = `Правильно: ${correctCount} из 4. Заполнено: ${filledCount} из 4.`;
            resultDiv.style.color = 'var(--T)';
        }
    });

    // --- ПОКАЗАТЬ ОТВЕТ ---
    document.getElementById('showAnswer').addEventListener('click', () => {
        // Сначала очищаем всё
        resetBoard();

        // Расставляем правильные ответы
        dropZones.forEach(zone => {
            const correctAnswer = zone.dataset.answer;
            const card = document.getElementById(`img-${correctAnswer}`);
            
            if (card) {
                placeImageInZone(card, zone);
                zone.classList.add('correct');
                zone.classList.remove('wrong');
            }
        });

        resultDiv.textContent = '👁 Правильные ответы показаны.';
        resultDiv.style.color = 'var(--C)';
    });

    // --- СБРОС ---
    function resetBoard() {
        // Возвращаем все карточки в левую колонку
        imageCards.forEach(card => {
            card.classList.remove('placed', 'selected');
            imagesCol.appendChild(card);
        });
        
        // Очищаем зоны
        dropZones.forEach(zone => {
            zone.querySelectorAll('.placed-img').forEach(img => img.remove());
            zone.classList.remove('correct', 'wrong', 'over');
        });
        
        selectedCard = null;
        resultDiv.textContent = '';
    }

    document.getElementById('reset').addEventListener('click', resetBoard);
</script>

<script>
/* оформление: двойные спирали по краям */
(function(){
  const BASES=['A','T','G','C'],COL={A:'#3ddc97',T:'#ff5d73',G:'#ffc53d',C:'#4aa8ff'},PAIR={A:'T',T:'A',G:'C',C:'G'};
  let s=21;const rnd=()=>((s=(s*1664525+1013904223)>>>0)/4294967296);
  const W=120,H=1000,cx=60,amp=38,period=260,n=130;
  let a='',b='',r='';
  for(let i=0;i<=n;i++){const y=i/n*H,ph=y/period*Math.PI*2;a+=(i?'L':'M')+(cx+amp*Math.sin(ph)).toFixed(1)+' '+y.toFixed(1);b+=(i?'L':'M')+(cx-amp*Math.sin(ph)).toFixed(1)+' '+y.toFixed(1)}
  for(let y=10;y<H;y+=15){const ph=y/period*Math.PI*2,sn=Math.sin(ph),x1=cx+amp*sn,x2=cx-amp*sn,bs=BASES[Math.floor(rnd()*4)],pb=PAIR[bs],o=(.25+.6*Math.abs(Math.cos(ph))).toFixed(2);
    r+=`<line x1="${x1.toFixed(1)}" y1="${y}" x2="${cx}" y2="${y}" stroke="${COL[bs]}" stroke-width="3" stroke-linecap="round" opacity="${o}"/><line x1="${cx}" y1="${y}" x2="${x2.toFixed(1)}" y2="${y}" stroke="${COL[pb]}" stroke-width="3" stroke-linecap="round" opacity="${o}"/>`}
  const svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${r}<path d="${a}" fill="none" stroke="rgba(214,222,255,.5)" stroke-width="2.2"/><path d="${b}" fill="none" stroke="rgba(214,222,255,.25)" stroke-width="2.2"/></svg>`;
  document.getElementById('helixL').innerHTML=svg;document.getElementById('helixR').innerHTML=svg;
})();

/* нуклеотиды в цепях окрашены в цвета A, T, G, C */
(function(){
  const map={'А':'A','Т':'T','У':'T','Г':'G','Ц':'C'};
  document.querySelectorAll('.dna-seq').forEach(el=>{
    const t=el.textContent.trim();
    if(!/^[АТГЦУ\-]+$/.test(t)) return;
    el.setAttribute('aria-label',t);
    el.innerHTML=[...t].map(ch=>map[ch]?`<span class="nt nt-${map[ch]}">${ch}</span>`:`<span class="nt nt-sep">${ch}</span>`).join('');
  });
})();
</script>
</body>
</html>
